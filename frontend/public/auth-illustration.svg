    <rect x="590" y="226" width="18" height="28" rx="6" fill="#F59E0B"/>
    <rect x="486" y="260" width="60" height="36" rx="8" fill="#A78BFA"/>
    <rect x="552" y="260" width="56" height="36" rx="8" fill="#FB7185"/>
    <path d="M450 314H640C652 314 662 324 662 336V344H428V336C428 324 438 314 450 314Z" fill="#334155"/>
    <rect x="428" y="344" width="234" height="14" rx="7" fill="#475569"/>

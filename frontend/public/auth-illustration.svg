<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="150" y1="40" x2="760" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#F8FAFF"/>
    </linearGradient>
    <linearGradient id="wood" x1="240" y1="270" x2="640" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6C6A1"/>
      <stop offset="1" stop-color="#F0B38A"/>
    </linearGradient>
    <linearGradient id="chair" x1="580" y1="300" x2="760" y2="520" gradientUnits="userSpaceOnUse">

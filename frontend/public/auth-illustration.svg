      <stop offset="1" stop-color="#FF6FA6"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="940" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Soft card background (to blend in right panel) -->
